<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | SoundWave</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SoundWave</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Manage Tracks</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="cart.html">Shopping Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="user.html">Join SoundWave</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <h1 class="mb-1">Shopping Cart</h1>
        <p class="text-muted mb-4">Search the catalog, add tracks to your cart and send your order.</p>

        <!-- Success / error message (filled in by jQuery) -->
        <div id="message" class="alert d-none" role="alert"></div>

        <!-- ============ Search toolbar ============ -->
        <h2 class="h4 mb-3">Find Tracks</h2>
        <div class="row g-2 align-items-end mb-3" id="toolbar">
            <div class="col-md-6">
                <label for="searchBox" class="form-label mb-1">Search</label>
                <div class="input-group">
                    <input type="search" class="form-control" id="searchBox"
                           placeholder="Search by title, genre, format or artist…" autocomplete="off">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn">Clear</button>
                </div>
            </div>
        </div>

        <!-- ============ Search results ============ -->
        <div class="table-responsive bg-white rounded shadow-sm mb-5">
            <table class="table table-hover align-middle mb-0" id="resultsTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Format</th>
                        <th class="text-end">Price</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <!-- ============ Cart ============ -->
        <h2 class="h4 mb-3">Your Cart</h2>

        <div class="table-responsive bg-white rounded shadow-sm mb-3">
            <table class="table table-hover align-middle mb-0" id="cartTable">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th class="text-center">Qty</th>
                        <th class="text-end">Price</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="cartBody"></tbody>
            </table>
        </div>

        <!-- Total + buttons -->
        <div class="cart-summary d-flex flex-wrap justify-content-between align-items-center gap-3">
            <p class="fw-bold fs-5 mb-0">Total: <span id="cartTotal">$0.00</span></p>
            <div>
                <button type="button" class="btn btn-dark" id="checkoutBtn">Send Cart to API</button>
                <button type="button" class="btn btn-outline-secondary ms-2" id="clearCartBtn">Clear Cart</button>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 SoundWave Music Community</p>
    </footer>

    <!-- Bootstrap JS, then jQuery, then page logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="cart.js"></script>
</body>
</html>
